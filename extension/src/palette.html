<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Cmd+K</title>
    <script src="boot.js"></script>
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="palette.css" />
  </head>
  <body>
    <div class="scrim" id="scrim">
      <div class="panel" id="panel" role="dialog" aria-label="Command palette" hidden>
        <div class="search">
          <span class="search-icon" id="search-icon"></span>
          <span class="crumbs" id="crumbs"></span>
          <input
            id="input"
            type="text"
            role="combobox"
            aria-expanded="true"
            aria-controls="list"
            aria-autocomplete="list"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Search tabs, settings and commands"
          />
          <kbd>Esc</kbd>
        </div>
        <div class="scopes" id="scopes" role="tablist" aria-label="Search scope"></div>
        <div class="list" id="list" role="listbox" aria-label="Results"></div>
        <div class="footer">
          <span class="status" id="status" role="status" aria-live="polite"></span>
          <span class="hints">
            <span><kbd>↑</kbd><kbd>↓</kbd> Move</span>
            <span><kbd>↵</kbd> Run</span>
            <span id="hint-scope"><kbd>Tab</kbd> Scope</span>
            <span id="hint-back" hidden><kbd>Esc</kbd> Back</span>
          </span>
        </div>
      </div>
    </div>
    <script type="module" src="palette.js"></script>
  </body>
</html>
